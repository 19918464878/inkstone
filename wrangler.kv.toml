name = "inkstone"
main = "src/worker/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/",
  "/index.html",
  "/api",
  "/api/*",
  "/s",
  "/s/*",
  "/authorize",
  "/authorize/*",
  "/oauth/*",
  "/mcp",
  "/mcp/*",
  "/.well-known/*",
]

[[d1_databases]]
binding = "DB"
database_name = "inkstone-db"
database_id = "0dc6b5b7-ad02-4a75-9696-c9451dae59c0"

[[kv_namespaces]]
binding = "FILES_KV"
id = "1f951445ec734c198ef6d4b3be7da5a5"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "f8758600a3974748b71c170787fd7f2e"

[[durable_objects.bindings]]
name = "SYNC_HUB"
class_name = "SyncHub"

[[durable_objects.bindings]]
name = "CREDENTIAL_VAULT"
class_name = "CredentialVault"

[exports.SyncHub]
type = "durable-object"
storage = "sqlite"

[exports.CredentialVault]
type = "durable-object"
storage = "sqlite"

[triggers]
crons = ["0 * * * *", "15,45 * * * *"]

[vars]
APP_NAME = "Inkstone"

[observability]
enabled = true
